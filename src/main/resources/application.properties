spring.application.name=caminho-remoto-api
server.port=8080

# DECISÃO EM ABERTO: banco de dados definitivo.
# Por enquanto usamos o H2 em memória: não precisa instalar nada, mas os dados somem ao reiniciar.
spring.datasource.url=jdbc:h2:mem:caminhoremoto
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Chave usada para assinar o JWT. Precisa ter pelo menos 32 caracteres.
# Em produção, defina a variável de ambiente JWT_CHAVE_SECRETA com um valor secreto e aleatório.
autenticacao.jwt.chave-secreta=${JWT_CHAVE_SECRETA:chave-somente-para-desenvolvimento-troque-em-producao}
autenticacao.jwt.validade=8h

# Em produção (com HTTPS) deve ser true, para o cookie só trafegar em conexão segura.
autenticacao.cookie.seguro=false

# Endereço do front que pode chamar esta API.
autenticacao.front.origem=http://localhost:3000
