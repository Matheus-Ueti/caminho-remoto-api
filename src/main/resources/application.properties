spring.application.name=caminho-remoto-api
server.port=8080

# O cookie de sessão só é enviado em pedidos feitos a partir do próprio site (proteção contra outros sites).
server.servlet.session.cookie.same-site=lax

# Endereço do front que pode chamar esta API e para onde a pessoa volta depois de entrar ou sair.
autenticacao.front.origem=http://localhost:3000

# ---------- Vagas ----------
# De quanto em quanto tempo a API busca vagas novas nas fontes (PT6H = 6 horas).
vagas.intervalo-de-atualizacao=PT6H

# Jooble: agregador de vagas. A chave é pedida em https://jooble.org/api/about.
# Defina a variável de ambiente JOOBLE_API_KEY com ela. Sem chave, a lista de vagas fica vazia.
jooble.endereco=https://jooble.org/api/
jooble.chave=${JOOBLE_API_KEY:}
# Uma busca por palavra-chave, separadas por vírgula.
jooble.palavras-chave=home office,trabalho remoto
jooble.local=Brasil

# ---------- Keycloak (servidor de login) ----------
# Roda na porta 8180. Para subir: keycloak/iniciar-keycloak.cmd (veja o README).
keycloak.endereco=http://localhost:8180/realms/caminho-remoto
keycloak.endereco-de-saida=${keycloak.endereco}/protocol/openid-connect/logout

spring.security.oauth2.client.registration.keycloak.client-id=caminho-remoto-api
# Em produção, defina a variável de ambiente KEYCLOAK_CLIENT_SECRET com o segredo gerado no Keycloak.
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:segredo-somente-para-desenvolvimento}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Endereços escritos um a um (em vez de "issuer-uri") para a API conseguir subir mesmo com o Keycloak desligado.
spring.security.oauth2.client.provider.keycloak.authorization-uri=${keycloak.endereco}/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=${keycloak.endereco}/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${keycloak.endereco}/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.user-info-uri=${keycloak.endereco}/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.keycloak.user-name-attribute=sub
